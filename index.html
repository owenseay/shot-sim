<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Shot Sim</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #f5f5f5;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  img {
    display: block;
    max-width: min(55vw, 400px);
    max-height: 55vh;
    width: auto;
    height: auto;
    cursor: pointer;
    transition: transform 0.06s ease;
    touch-action: manipulation;
  }

  img:active, img.pressed {
    transform: scale(0.985);
  }

  /* Tablet */
  @media (max-width: 1024px) {
    img {
      max-width: 70vw;
      max-height: 55vh;
    }
  }

  /* Phone */
  @media (max-width: 600px) {
    img {
      max-width: 85vw;
      max-height: 60vh;
    }
  }
</style>
</head>
<body>
<img src="the-piece.png" alt="" draggable="false" id="piece">
<script>
  const img = document.getElementById('piece');

  // Web Audio API — decode once, replay from memory with zero latency
  let ctx = null;
  let audioBuffer = null;
  let activeSource = null;

  // First click initialises the AudioContext (browsers require user gesture)
  // and decodes the file; subsequent clicks play instantly from the buffer.
  async function init() {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const resp = await fetch('the-shot-2.m4a');
    const data = await resp.arrayBuffer();
    audioBuffer = await ctx.decodeAudioData(data);
  }

  function playShot() {
    // Stop the previous instance immediately
    if (activeSource) {
      try { activeSource.stop(); } catch (_) {}
    }
    // Create a new buffer source — these are lightweight and disposable
    const src = ctx.createBufferSource();
    src.buffer = audioBuffer;
    src.connect(ctx.destination);
    src.start(0);
    activeSource = src;
  }

  // Touch press effect (mobile doesn't reliably fire :active)
  img.addEventListener('touchstart', () => img.classList.add('pressed'), { passive: true });
  img.addEventListener('touchend', () => img.classList.remove('pressed'), { passive: true });
  img.addEventListener('touchcancel', () => img.classList.remove('pressed'), { passive: true });

  img.addEventListener('click', async () => {
    await init();
    if (audioBuffer) playShot();
  });
</script>
</body>
</html>
